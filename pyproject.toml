[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packetpulse"
dynamic = ["version"]
description = "Terminal-based modular cybersecurity monitoring platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PacketPulse Contributors" }]
keywords = ["cybersecurity", "network", "packet", "ids", "forensics", "urlscan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0",
    "dnspython>=2.4.0",
    "python-whois>=0.8.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "geoip2>=4.7.0",
    "maxminddb>=2.3.0",
    "pyudev>=0.24.0; platform_system == 'Linux'",
    "manuf>=1.1.5",
    "tldextract>=5.1.0",
    "urllib3>=2.0.0",
    "cryptography>=41.0.0",
    "python-nmap>=0.7.1",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build", "twine"]

[project.urls]
Homepage = "https://github.com/tejppatil/PacketPulse"
Repository = "https://github.com/tejppatil/PacketPulse"
Issues = "https://github.com/tejppatil/PacketPulse/issues"


[project.scripts]
packetpulse = "packetpulse:main"

[tool.setuptools.dynamic]
version = {attr = "packetpulse.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["packetpulse*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness and safety rules. Cosmetic reformatting of the existing dense
# report-generation code is deliberately not enforced.
select = ["F", "E4", "E7", "E9", "B", "S102", "S103", "S108", "S602", "S604", "S605"]
ignore = [
    "E402",  # imports after a platform/encoding guard are intentional here
    "E741",  # single-letter names in the existing report builders
    "B008",  # function calls in argument defaults
    # E701/E702 flag `if x: return` and `a = 1; b = 2`. The original capture and
    # report modules are written in that compact style throughout; reformatting
    # ~100 sites would be a large diff with no behavioural benefit, so the style
    # is accepted rather than silently failing every lint run.
    "E701",
    "E702",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
